name: massdriver-wireguard-tunnel
version: 0.1.0
label: WireGuard Tunnel
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-resource-types/main/massdriver-wireguard-tunnel/icon.svg

ui:
  connectionOrientation: link
  instructions:
    - label: Set up a WireGuard tunnel
      path: ./instructions/setup.md
    - label: Security
      path: ./instructions/security.md

exports:
  - downloadButtonText: wg0.conf
    fileFormat: conf
    templatePath: ./exports/wg0.conf.liquid
    templateLang: liquid

schema:
  title: WireGuard Tunnel
  description: >-
    A WireGuard client configuration that lets a deployment reach a private network, such as the
    VPC of a remote environment. The fields use the names of a wg-quick configuration file:
    `interface` is the `[Interface]` section, and each item of `peers` is a `[Peer]` section.
  type: object
  additionalProperties: false
  required:
    - interface
    - peers
  examples:
    - interface:
        private_key: yAnz5TF+lXXJte14tji3zlMNq+hd2rYUIgJBgB3fBmk=
        address:
          - 10.200.0.2/32
        dns:
          - 10.0.0.2
        mtu: 1420
      peers:
        - public_key: xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg=
          preshared_key: FpCyhws9cxwWoV4xELtfJvjJN+zQVRPISllRWgeopVE=
          endpoint: vpn.example.com:51820
          allowed_ips:
            - 10.0.0.0/16
          persistent_keepalive: 25
    - interface:
        private_key: 0H3bS7lQGMnq6cxRbPq3nXmE4XQ5gN1b2u1x9Ff7G1U=
        address:
          - 10.200.0.3/32
          - fd00:200::3/128
      peers:
        - public_key: HIgo9xNzJMWLKASShiTqIybxZ0U3wGLiUeJ1PKf8ykw=
          endpoint: 198.51.100.7:51820
          allowed_ips:
            - 10.0.0.0/16
            - fd00:10::/48
        - public_key: TrMvSoP4jYQlY6RIzBgbssQqY3vxI2Pi+y71lOWWXX0=
          endpoint: '[2001:db8::1]:51820'
          allowed_ips:
            - 10.1.0.0/16
          persistent_keepalive: 25
  properties:
    interface:
      title: Interface
      description: The local side of the tunnel. It is the `[Interface]` section of `wg0.conf`.
      type: object
      additionalProperties: false
      required:
        - private_key
        - address
      properties:
        private_key:
          $md.sensitive: true
          title: Private key
          description: >-
            The private key of this side of the tunnel, from `wg genkey`. It is 32 bytes encoded
            as base64, 44 characters long. Sets `PrivateKey`.
          type: string
          pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
        address:
          title: Addresses
          description: >-
            The tunnel addresses of this side, in CIDR notation, such as `10.200.0.2/32`. Each
            address must be free in the networks that the tunnel reaches. Sets `Address`.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$|^[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$
          examples:
            - - 10.200.0.2/32
            - - 10.200.0.2/32
              - fd00:200::2/128
        dns:
          title: DNS servers
          description: >-
            DNS servers to use while the tunnel is up, such as the resolver of the remote VPC. An
            item that is not an IP address is a search domain. Leave it empty to keep the DNS
            settings of the host. Sets `DNS`.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[0-9A-Za-z][0-9A-Za-z.:-]*$
          examples:
            - - 10.0.0.2
            - - 10.0.0.2
              - internal.example.com
        mtu:
          title: MTU
          description: >-
            The maximum packet size on the tunnel, in bytes. Leave it empty to let wg-quick choose
            it from the route to the peer, usually 1420. Sets `MTU`.
          type: integer
          minimum: 576
          maximum: 9000
          examples:
            - 1420
    peers:
      title: Peers
      description: >-
        The remote sides of the tunnel, such as a WireGuard server in the remote VPC. Each peer is a
        `[Peer]` section of `wg0.conf`.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - public_key
          - endpoint
          - allowed_ips
        properties:
          public_key:
            title: Public key
            description: >-
              The public key of the peer, from `wg pubkey`. It is 44 characters long. Sets
              `PublicKey`.
            type: string
            pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
          preshared_key:
            $md.sensitive: true
            title: Preshared key
            description: >-
              An optional extra symmetric key from `wg genpsk`, the same on both sides. It adds a
              layer of post-quantum resistance. Sets `PresharedKey`.
            type: string
            pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
          endpoint:
            title: Endpoint
            description: >-
              The public address and UDP port of the peer, as `host:port`. Put an IPv6 address in
              brackets, such as `[2001:db8::1]:51820`. Sets `Endpoint`.
            type: string
            pattern: ^(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
            examples:
              - vpn.example.com:51820
              - 198.51.100.7:51820
              - '[2001:db8::1]:51820'
          allowed_ips:
            title: Allowed IPs
            description: >-
              The networks to send through this peer, in CIDR notation, such as the CIDR of the
              remote VPC. Do not use `0.0.0.0/0` unless all traffic must go through the tunnel. Sets
              `AllowedIPs`.
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$|^[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$
            examples:
              - - 10.0.0.0/16
          persistent_keepalive:
            title: Persistent keepalive
            description: >-
              Seconds between keepalive packets. Set `25` when this side is behind NAT or a
              firewall, so that the peer can send to it. `0` or empty turns it off. Sets
              `PersistentKeepalive`.
            type: integer
            minimum: 0
            maximum: 65535
            examples:
              - 25
